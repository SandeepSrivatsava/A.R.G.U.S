# Argus Eye: the iPhone app for Argus (Meta glasses camera + push-to-talk).
# Generate the Xcode project on your Mac:  brew install xcodegen && cd ios && xcodegen
name: ArgusEye
options:
  bundleIdPrefix: com.argus
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  ArgusEye:
    type: application
    platform: iOS
    sources:
      - path: ArgusEye
    entitlements:
      path: ArgusEye/ArgusEye.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true   # the glasses stream video over their own Wi-Fi
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    info:
      path: ArgusEye/Info.plist
      properties:
        CFBundleDisplayName: Argus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [arguseye]
        MWDAT:
          AppLinkURLScheme: "arguseye://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
        UIBackgroundModes: [processing, bluetooth-central, audio, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: Argus connects to your Meta glasses over Bluetooth.
        NSBluetoothPeripheralUsageDescription: Argus connects to your Meta glasses over Bluetooth.
        NSLocalNetworkUsageDescription: Argus talks to your glasses over their Wi-Fi to get pictures.
        NSBonjourServices: [_bonjour._tcp]
        NSMicrophoneUsageDescription: Argus listens only while you hold the talk button.
        NSSpeechRecognitionUsageDescription: Your words are turned into text on this iPhone before being sent to your Mac.
        NSCameraUsageDescription: Only used by Meta's test mode when no glasses are connected.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true    # plain HTTP is only used inside your Tailscale network, which is encrypted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ARGUS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
